<div class="car-card" *ngFor="let vehicle of vehicles" (click)="goToDetails(vehicle)">
  <img
    class="car-image"
    [src]="vehicle.mainImageUrl || 'assets/images/cars/default-car.png'"
    alt="Imagen de {{ vehicle.brand }} {{ vehicle.model }}"
  />

  <div class="car-info">
    <h3>{{ vehicle.brand }} {{ vehicle.model }}</h3>
    <p class="car-meta">
      {{ vehicle.year }} · {{ vehicle.mileageKm | number }} km · {{ vehicle.plate }}
    </p>
    <p class="price">
      {{ vehicle.priceAmount | currency: vehicle.priceCurrency }}
    </p>
    <span class="status-chip" *ngIf="vehicle.status">
      {{ vehicle.status }}
    </span>
  </div>
</div>
