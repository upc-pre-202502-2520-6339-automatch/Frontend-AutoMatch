<form [formGroup]="form" (ngSubmit)="onSubmit()">

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>First Name</mat-label>
    <input matInput formControlName="firstName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Last Name</mat-label>
    <input matInput formControlName="lastName">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Email</mat-label>
    <input matInput formControlName="email">
  </mat-form-field>

  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Phone Number</mat-label>
    <input matInput formControlName="phoneNumber">
  </mat-form-field>

  <!-- Rol de perfil (no confundir con roles del JWT) -->
  <mat-form-field appearance="outline" class="full-width">
    <mat-label>Profile Role</mat-label>
    <mat-select formControlName="roleType">
      <mat-option *ngFor="let r of roleTypes" [value]="r">{{ r }}</mat-option>
    </mat-select>
  </mat-form-field>

  <!-- Campos de vendedor solo si roleType === 'SELLER' -->
  <ng-container *ngIf="form.get('roleType')?.value === 'SELLER'">

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>RUC</mat-label>
      <input matInput formControlName="ruc">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Business Type</mat-label>
      <mat-select formControlName="businessType">
        <mat-option *ngFor="let b of businessTypes" [value]="b">{{ b }}</mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Business Name</mat-label>
      <input matInput formControlName="businessName">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Address</mat-label>
      <input matInput formControlName="address">
    </mat-form-field>

  </ng-container>

  <button mat-raised-button color="primary" type="submit" [disabled]="loading">
    {{ loading ? 'Saving...' : 'Save Profile' }}
  </button>

  <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
</form>
