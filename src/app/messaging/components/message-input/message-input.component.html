<!-- message-input.component.html -->
<div class="message-input">
  <textarea
    [(ngModel)]="text"
    (keydown)="onKeyDown($event)"
    rows="2"
    class="message-textarea"
    placeholder="Escribe un mensaje..."
  ></textarea>

  <button
    type="button"
    class="send-button"
    (click)="onSend()"
    [disabled]="!text.trim()"
  >
    <span class="material-symbols-outlined">send</span>
  </button>
</div>
