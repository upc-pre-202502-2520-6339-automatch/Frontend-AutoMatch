<div class="message-list">
  <div
    *ngFor="let m of messages"
    class="message-item"
    [ngClass]="isMine(m) ? 'message-item--own' : 'message-item--other'"
  >
    <div class="message-content">
      {{ m.content }}
    </div>
    <div class="message-meta">
      {{ m.createdAt | date : 'short' }} · {{ m.status }}
    </div>
  </div>
</div>
